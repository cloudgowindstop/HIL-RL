# Tiny end-to-end training configuration.
# Purpose: verify data loading, objective sampling, backward, validation, and checkpoint saving.

model:
  experiment: cosmos_predict2_2b_480p_our_dataset
  config_file: cosmos_policy/config/config.py
  initialization: predict2_base
  checkpoint_path: /media/jushen/mingbo-ge/HIL-RL-Project/cosmos-policy/cosmos_policy/models/Cosmos-Policy-LIBERO-Predict2-2B/model-480p-16fps.pt
  tokenizer_path: /media/jushen/mingbo-ge/HIL-RL-Project/cosmos-policy/cosmos_policy/models/Cosmos-Policy-LIBERO-Predict2-2B/tokenizer/tokenizer.pth
  precision: bfloat16
  strict_checkpoint: false

data:
  source_root: null
  root: /media/jushen/mingbo-ge/HIL-RL-Project/cosmos_data_6drotation_monitor_20260819
  # Dedicated manifests were generated from max_episodes=10; they are reused on every run.
  train_manifest: /media/jushen/mingbo-ge/HIL-RL-Project/train_outputs/back_handle_joint_6d_tiny/splits/train.json
  val_manifest: /media/jushen/mingbo-ge/HIL-RL-Project/train_outputs/back_handle_joint_6d_tiny/splits/val.json
  test_manifest: null
  t5_embeddings_path: /media/jushen/mingbo-ge/HIL-RL-Project/t5_embeddings_by_task/back_handle_installation_20260803_pm/t5_embeddings.pkl
  statistics_path: /media/jushen/mingbo-ge/HIL-RL-Project/cosmos_data_6drotation_monitor_20260819/back_handle_20260803_pm_success/dataset_statistics.json
  action_encoding: cosmos_rotation_6d
  action_dimension: 20
  action_includes_gripper: true
  number_of_arms: 2
  chunk_size: 16
  # Zero workers makes initial debugging deterministic and keeps CPU use small.
  workers_per_rank: 0
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: false

training:
  seed: 42
  epochs: 1
  # 100 optimizer updates are enough to exercise all training machinery.
  max_steps: 100
  batch_size_per_rank: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  validation_every_epochs: 1
  # Save halfway and at the end to verify checkpoint/resume behavior.
  checkpoint_every_steps: 50
  log_every_steps: 1
  gradient_clip_norm: 10.0

objectives:
  # Match the completed 20K experiment: policy/world/value = 0.50/0.25/0.25.
  training_mode: base_joint

split:
  create_if_missing: true
  overwrite: false
  seed: 42
  # Small enough for fast indexing while still providing train and validation episodes.
  max_episodes: 10
  ratios: [0.8, 0.2, 0.0]

evaluation:
  noise_seed: 20260820
  sigma_values: [0.1, 0.5, 0.9]
  objectives: [policy, world, value, inverse_dynamics]
  inverse_condition_ablations: [normal]
  # Two transitions per condition keeps end-of-training validation short.
  max_validation_batches: 2
  progress_every_batches: 1
  cache_episodes: 1
  bootstrap_samples: 100

runtime:
  # Dedicated locations prevent any write into the completed 20K experiment.
  output_dir: /media/jushen/mingbo-ge/HIL-RL-Project/train_outputs/back_handle_joint_6d_tiny
  smoke_output_dir: /media/jushen/mingbo-ge/HIL-RL-Project/train_outputs/back_handle_joint_6d_tiny_smoke
  smoke_test: false
  smoke_max_train_steps: 10
  smoke_max_validation_batches: 2
