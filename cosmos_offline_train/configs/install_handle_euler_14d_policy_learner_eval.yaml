# Four-GPU Policy training with learner_copy_dist-compatible whole-split validation.

model:
  experiment: cosmos_predict2_2b_480p_our_dataset
  config_file: cosmos_policy/config/config.py
  initialization: pretrained_checkpoint
  checkpoint_path: /media/jushen/mingbo-ge/HIL-RL-Project/cosmos-policy/cosmos_policy/models/Cosmos-Policy-LIBERO-Predict2-2B/model-480p-16fps.pt
  tokenizer_path: /media/jushen/mingbo-ge/HIL-RL-Project/cosmos-policy/cosmos_policy/models/Cosmos-Policy-LIBERO-Predict2-2B/tokenizer/tokenizer.pth
  precision: bfloat16
  strict_checkpoint: false

data:
  root: /media/jushen/mingbo-ge/install_handle
  layout: pre_split
  train_directory: train
  val_directory: eval
  train_manifest: /media/jushen/mingbo-ge/install_handle/manifests/train.json
  val_manifest: /media/jushen/mingbo-ge/install_handle/manifests/val.json
  test_manifest: null
  t5_embeddings_path: /media/jushen/mingbo-ge/HIL-RL-Project/t5_embeddings_by_task/back_handle_installation_20260803_pm/t5_embeddings.pkl
  statistics_path: /media/jushen/mingbo-ge/HIL-RL-Project/HIL-RL/dataset_cosmos/back_handle_20260803_pm_memory_test/dataset_statistics.json
  action_encoding: legacy_euler
  action_dimension: 14
  rotation_scale: 0.06
  action_includes_gripper: true
  number_of_arms: 2
  chunk_size: 16
  workers_per_rank: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

training:
  seed: 42
  # 6 ranks x 1 sample/rank x 21 micro-batches = 126 samples/update.
  epochs: 3
  max_steps: 2000
  batch_size_per_rank: 1
  gradient_accumulation_steps: 21
  learning_rate: 1.0e-4
  validation_every_epochs: 0
  validation_every_steps: 100
  checkpoint_every_steps: 1000
  log_every_steps: 5
  gradient_clip_norm: 10.0
  save_every_epochs: false
  validate_at_end: true
  checkpoint_at_end: true

objectives:
  training_mode: policy_only
  policy_auxiliary_targets: true
  # Match learner_copy_dist.py: zero masked positions, then mean over full latent.
  loss_reduction: learner_actor_full_tensor_mean

split:
  create_if_missing: false
  overwrite: false
  max_episodes: 0

evaluation:
  protocol: learner_actor
  noise_seed: 20260827
  max_validation_batches: null
  progress_every_batches: 100
  cache_episodes: 1
  evaluate_base_before_training: true

monitoring:
  prometheus_enabled: true
  host: 0.0.0.0
  port: 8000
  path: /metrics

runtime:
  output_dir: /media/jushen/mingbo-ge/HIL-RL-Project/train_outputs/install_handle_euler_14d_policy_learner_eval
  smoke_output_dir: /media/jushen/mingbo-ge/HIL-RL-Project/train_outputs/install_handle_euler_14d_policy_learner_eval_smoke
  smoke_test: false
  smoke_max_train_steps: 20
  smoke_max_validation_batches: 1
  plot_after_training: true
