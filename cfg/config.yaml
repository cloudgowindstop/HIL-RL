defaults:
  - _self_
  - robot_type@_global_: franka
  - task@_global_: close_trashbin_franka_1028
  # - override hydra/launcher: submitit_local
  # - override hydra/launcher: basic # override问题，修改到下面直接写launcher



fake_env: false
control_mode: pose
lerobot_config_path: None
freeze_actor: false
use_human_intervention: false
policy_type: silri
ego_mode: false
use_force: false
load_classifier: true
load_path: null
intervention_mode: pose
absolute_action: false
# true: 用 xrocs robot.ros2controller 发指令；false: 用 ros2 topic pub（不依赖 EAIHardware）
use_ros2controller: true


hydra:
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${hydra.job.override_dirname}
  sweep:
    dir: ./exp_local
    subdir: ${now:%Y.%m.%d}/${hydra.job.override_dirname}
